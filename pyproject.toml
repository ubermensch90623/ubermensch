[project]
name = "ubermensch"
version = "0.1.0"
description = "Multi-Agent Orchestration Framework"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
ubermensch = "ubermensch.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ubermensch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
