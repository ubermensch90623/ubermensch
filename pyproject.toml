[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insane-search"
version = "0.1.0"
description = "Claude Code의 WebSearch/WebFetch를 강화하는 MCP 서버"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ubermensch" }]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "markdownify>=0.13.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
insane-search = "insane_search.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/insane_search"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
