<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NCS 복원 Harness — 캠코·수협</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/ui/assets/tokens.css" />
  <style>
    body { background: var(--bg-1); color: var(--text-primary); }
    .panel { background: var(--bg-2); border-radius: var(--radius-md); }
    .divider { background: var(--bg-3); }
    .pill { background: var(--bg-3); color: var(--text-accent); padding: 2px 10px; border-radius: 999px; font-size: 12px; }
    .hb-badge { min-width: 44px; min-height: 28px; }
    kbd { background: var(--bg-3); color: var(--text-accent); padding: 2px 6px; border-radius: 4px; font-family: var(--font-mono); font-size: 12px; }
    .mindmap-node { padding: 6px 10px; border-radius: 6px; cursor: pointer; color: var(--text-secondary); }
    .mindmap-node:hover { background: var(--bg-3); color: var(--text-primary); }
    .mindmap-node.active { background: var(--yellow-bg-strong); color: var(--text-accent); }
    .heat-red   { background: rgba(239, 68, 68, 0.22); }
    .heat-amber { background: rgba(251, 191, 36, 0.22); }
    .heat-green { background: rgba(34, 197, 94, 0.22); }
  </style>
</head>
<body x-data="harness" x-init="boot()" class="min-h-screen">
  <!-- Header -->
  <header class="flex items-center justify-between px-5 py-3 divider" style="background: var(--bg-2);">
    <div class="flex items-center gap-3">
      <span class="font-bold text-lg" style="color: var(--text-accent);">NCS 복원 Harness</span>
      <span class="pill" x-text="'북극성 95% · 현재 ' + (globalRate() * 100).toFixed(1) + '%'"></span>
    </div>
    <div class="flex items-center gap-3 text-sm" style="color: var(--text-secondary);">
      <span>기관:</span>
      <template x-for="a in agencies" :key="a">
        <button @click="setAgency(a)"
          :class="a === currentAgency ? 'pill' : ''"
          class="px-2 py-1 rounded hb-badge" x-text="a"></button>
      </template>
      <button @click="togglePanel('left')" class="pill hb-badge">≡</button>
      <button @click="togglePanel('right')" class="pill hb-badge">⚑</button>
    </div>
  </header>

  <!-- Main 3-panel -->
  <main class="grid gap-3 p-3"
        :class="layoutClass()"
        style="min-height: calc(100vh - 96px);">

    <!-- Left: mindmap -->
    <aside class="panel p-4 overflow-auto" x-show="panels.left" style="max-height: calc(100vh - 96px);">
      <h2 class="font-bold mb-3" style="color: var(--text-accent);">영역 지도</h2>
      <template x-for="area in currentMatrix.areas" :key="area.name">
        <div class="mindmap-node"
             :class="{'active': area.name === currentArea}"
             @click="setArea(area.name)">
          <div class="flex justify-between items-center">
            <span x-text="area.name"></span>
            <span class="text-xs" x-text="area.restored + '/' + (area.target || '?')"
                  :class="heatClass(area.rate)"></span>
          </div>
        </div>
      </template>
      <div class="mt-4 text-xs" style="color: var(--text-secondary);">
        <p>빨강 &lt;70% · 주황 70-89% · 초록 ≥90%</p>
      </div>
    </aside>

    <!-- Center: drill card -->
    <section class="panel p-5" x-show="true">
      <template x-if="restoredEmpty">
        <div class="box warn">
          <h3 class="font-bold" style="color: var(--text-accent);">실제 기출 반영 대기</h3>
          <p class="mt-2" style="color: var(--text-primary);">
            현재 C-0 통과 복원 문항이 없습니다.
            M3.5 P12 게이트에서 블로커 B2·B3 해소 대기 중.
          </p>
          <ul class="mt-3 text-sm list-disc list-inside" style="color: var(--text-secondary);">
            <li>B2: 캠코/수협 공식 공고 PDF 직접 다운로드 필요</li>
            <li>B3: kamco.or.kr 2job_write_test.pdf 바이너리 파싱 실패</li>
            <li>B1: 나라장터 data.go.kr 인증키 발급 필요</li>
          </ul>
          <p class="mt-3 text-sm" style="color: var(--text-warn-soft);">
            P12 RESET 판정을 자율모드에서 보류, log 에만 기록.
          </p>
        </div>
      </template>
      <template x-if="!restoredEmpty">
        <div id="drill-slot" x-html="drillHtml"></div>
      </template>
    </section>

    <!-- Right: source panel -->
    <aside class="panel p-4 overflow-auto" x-show="panels.right" style="max-height: calc(100vh - 96px);">
      <h2 class="font-bold mb-3" style="color: var(--text-accent);">소스 혈통</h2>
      <template x-if="lineage.length === 0">
        <p class="text-sm" style="color: var(--text-secondary);">아직 기록된 혈통 없음.</p>
      </template>
      <template x-for="e in lineage.slice(-20).reverse()" :key="e.entry_id">
        <div class="text-xs mb-2 p-2 rounded" style="background: var(--bg-1);">
          <div class="flex justify-between">
            <span class="font-mono" x-text="e.actor"></span>
            <span :class="stageClass(e.stage)" x-text="e.stage"></span>
          </div>
          <div class="mt-1 truncate" style="color: var(--text-secondary);" x-text="e.quoted_text || '(인용 없음)'"></div>
          <a x-show="e.source_url" :href="e.source_url" target="_blank"
             class="text-xs underline" style="color: var(--blue);" x-text="e.source_url"></a>
        </div>
      </template>
    </aside>
  </main>

  <!-- Footer: keyboard hints -->
  <footer class="flex items-center gap-3 px-5 py-2 text-xs divider" style="background: var(--bg-2); color: var(--text-secondary);">
    <kbd>Space</kbd> 답지우기
    <kbd>J</kbd>/<kbd>K</kbd> 다음/이전
    <kbd>1</kbd>-<kbd>9</kbd> 선지
    <kbd>[</kbd>/<kbd>]</kbd> 좌/우 패널
    <span class="ml-auto" x-text="footerStatus"></span>
  </footer>

  <script src="/ui/state.js"></script>
</body>
</html>
