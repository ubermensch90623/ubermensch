<!-- progress_map — 기관 × 영역 복원률 히트맵.
  state.js 가 /api/score 응답을 받아 각 셀을 heat-red/amber/green 클래스로 렌더.
  실제 동적 렌더는 index.html 의 좌측 aside 에서 Alpine x-for 로 이미 커버.
  이 파일은 M5 이후 "전체 대시보드 뷰" 풀페이지에서 재사용될 템플릿 스텁.
-->
<section class="progress-map p-4">
  <header class="flex justify-between items-center mb-3">
    <h2 class="font-bold" style="color: var(--text-accent);">복원률 매트릭스</h2>
    <span class="pill">북극성 95%</span>
  </header>

  <table class="w-full text-sm">
    <thead>
      <tr style="color: var(--text-secondary);">
        <th class="text-left p-2">기관</th>
        <th class="p-2">의사소통</th>
        <th class="p-2">수리</th>
        <th class="p-2">문제해결</th>
        <th class="p-2">선택과목</th>
        <th class="p-2">전체</th>
      </tr>
    </thead>
    <tbody data-role="rows">
      <!-- state.js 가 각 기관별 셀을 주입 -->
      <tr data-agency="캠코">
        <td class="p-2 font-bold" style="color: var(--text-accent);">캠코</td>
        <td class="p-2 heat-red" data-cell="의사소통">0/?</td>
        <td class="p-2 heat-red" data-cell="수리">0/?</td>
        <td class="p-2 heat-red" data-cell="문제해결">0/?</td>
        <td class="p-2 heat-red" data-cell="경제학(격리)">-</td>
        <td class="p-2 heat-red" data-cell="전체">0.0%</td>
      </tr>
      <tr data-agency="수협">
        <td class="p-2 font-bold" style="color: var(--text-accent);">수협</td>
        <td class="p-2 heat-red" data-cell="의사소통">0/?</td>
        <td class="p-2 heat-red" data-cell="수리">0/?</td>
        <td class="p-2 heat-red" data-cell="문제해결">0/?</td>
        <td class="p-2 heat-red" data-cell="선택과목">0/?</td>
        <td class="p-2 heat-red" data-cell="전체">0.0%</td>
      </tr>
    </tbody>
  </table>

  <p class="mt-3 text-xs" style="color: var(--text-secondary);">
    <span class="heat-red px-2 rounded">&lt;70%</span>
    <span class="heat-amber px-2 rounded mx-2">70-89%</span>
    <span class="heat-green px-2 rounded">≥90%</span>
  </p>

  <p class="mt-2 text-xs" style="color: var(--text-warn-soft);">
    ⚠ 현재 배점 수치 (캠코 60+20, 수협 50+100) 는 C-0 격리 상태. 공식 PDF 재검증(B2) 후 target 채워짐.
  </p>
</section>
